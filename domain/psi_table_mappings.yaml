version: psi-curated-fields-v2
authority: Original immutable PSI CSV headers, embedded table notes, and cached official
  investigation metadata; mappings describe recorded scope, never distinct physical
  run identity.
tables:
  PSI-107:
    record_class: SourceRecord
    identifier: null
    material_header: Fuel
    fields:
      GMT date:
        property: source:gmt_day
        datatype: categorical
        role: session_identifier
      GMT ignition:
        property: source:ignition_clock
        datatype: categorical
        role: recorded_time
      GMT  Flame Off:
        property: source:flame_off_clock
        datatype: categorical
        role: recorded_time
      Nozzle (mm):
        property: source:nozzle_diameter
        unit: mm
        role: apparatus_dimension
      Fuel Rate (sccm):
        property: source:fuel_standard_flow
        unit: sccm
        role: reported_condition
      Fuel Rate (mg/s):
        property: source:fuel_mass_flow
        unit: mg/s
        role: reported_condition
      HC Fuel Rate (mg/s):
        property: source:hydrocarbon_mass_flow
        unit: mg/s
        role: reported_condition
      Air Rate (cm/s):
        property: AirflowVelocity
        unit: cm/s
        role: reported_condition
        aliases: [air velocity]
