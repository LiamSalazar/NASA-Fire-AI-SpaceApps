statements:
- id: acme-cld-method
  source_id: ntrs-20220005205
  investigations:
  - psi-21
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  parts:
  - physical_page: 5
    text: "The \ndependence of normal coflow flames on injection velocity and fuel\
      \ dilution was carefully \nexamined for flames at both very dilute and highly\
      \ sooting conditions.  Measurements including \nflame temperature, CH* concentration,\
      \ soot temperature, and soot volume fraction were made of \nthe structure of\
      \ diluted methane and ethylene flames in an air coflow, where the fuel and air\
      \ \nvelocities are typically matched.  Lifted flames are a focus of the research\
      \ to avoid flame \ndependence on heat loss to the burner, where examples from\
      \ ISS testing can be seen in Fig. 3a."
- id: acme-cld-finding
  source_id: ntrs-20220005205
  investigations:
  - psi-21
  class: SourceReportedFinding
  relation: hasReportedFinding
  parts:
  - physical_page: 5
    text: "For sooty attached flames, preliminary results have revealed that the soot\
      \ volume fraction can \nbe several times greater in microgravity flames than\
      \ in comparison normal-gravity flames.  These \nmicrogravity flames are also\
      \ taller and wider.  Meanwhile, dilution limits for both methane and \nethylene\
      \ flames were extended in microgravity, where the microgravity flames are more\
      \ stable, \nallowing for lifted flames at lower fuel concentrations."
  context_statement: acme-cld-method
- id: acme-efield-method
  source_id: ntrs-20220005205
  investigations:
  - psi-22
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  parts:
  - physical_page: 6
    text: "The ISS tests were conducted burning pure and diluted methane and ethylene\
      \ with both gas-jet and \ncoflow flame configurations.  An electric field of\
      \ either polarity was generated by creating a high \nvoltage differential (up\
      \ to 10 kV) between the burner and a flat circular mesh above (i.e., \ndownstream\
      \ of) the burner.  Measurements were made of the ion current through the flame\
      \ and \nthe flame’s response to electric forcing as a function of the field\
      \ strength, fuel, and fuel dilution."
- id: acme-efield-finding
  source_id: ntrs-20220005205
  investigations:
  - psi-22
  class: SourceReportedFinding
  relation: hasReportedFinding
  parts:
  - physical_page: 6
    text: "In contrast to normal-gravity tests, the microgravity flames exhibit a\
      \ distinct peak ion current \nthat corresponds to the most compact flame, where\
      \ an example of the effect of the field strength \non the flame size can be\
      \ seen in Fig. 3b.  Soot generation could be suppressed and more broadly \n\
      there are clear correlations between the flame luminosity, combustion intensity,\
      \ and ion current in \nthe ISS data.  It was found that highly diluted flames\
      \ can be stabilized with very weak electric \nfields.  But at high field strengths,\
      \ the flames exhibited corona and arc discharges."
  context_statement: acme-efield-method
- id: acme-bre-method
  source_id: ntrs-20220005205
  investigations:
  - psi-20
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  parts:
  - physical_page: 6
    text: "A \nflat porous burner fed with gaseous fuel simulates the burning of solid\
      \ and liquid fuels, where \nmeasurements were made of the thermal feedback (i.e.,\
      \ to the burner) upon which the vaporization \nof condensed-phase fuels is dependent.\
      \  In the ISS tests, pure or nitrogen-diluted ethylene and \nmethane were used\
      \ to simulate the burning of materials such as plastics by matching properties\
      \ \nincluding the heats of combustion and gasification, the surface temperature,\
      \ and smoke point.  \nTesting included atmospheres with elevated oxygen concentrations\
      \ and reduced pressures being \nconsidered for future crew vehicles.  An example\
      \ dome-shaped flame can be seen in Fig. 4a."
- id: acme-bre-finding
  source_id: ntrs-20220005205
  investigations:
  - psi-20
  class: SourceReportedFinding
  relation: hasReportedFinding
  parts:
  - physical_page: 6
    text: "It was found that low-momentum microgravity flames can burn for minutes\
      \ in the absence of \nan air flow or flame spread.  Although the flames can\
      \ burn for minutes in elevated oxygen"
  - physical_page: 7
    text: "concentrations, like those being considered for future spacecraft, they\
      \ were found to self-\nextinguish in concentrations below ~25% (by volume).\
      \  While smaller flames can burn for minutes \nat elevated oxygen concentrations,\
      \ larger flames were generally seen to self-extinguish within 1.5 \nminutes.\
      \  Although ethylene flames at elevated oxygen concentrations can burn for minutes,\
      \ \nmethane flames were seen to self-extinguish within a minute."
  context_statement: acme-bre-method
- id: acme-flame-design-method
  source_id: ntrs-20220005205
  investigations:
  - psi-10
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  parts:
  - physical_page: 7
    text: "The tests were conducted with various concentrations of ethylene and oxygen\
      \ to determine the role \nof the flame structure on the soot inception.  The\
      \ effect of the flow direction on soot formation \nwas assessed by studying\
      \ both normal flames and inverse flames, in which the oxidizer flowed \nfrom\
      \ the burner into an atmosphere of gaseous fuel.  The burner, including its\
      \ supply tube, can be \nseen within an inverse flame in Fig. 4b."
- id: acme-flame-design-finding
  source_id: ntrs-20220005205
  investigations:
  - psi-10
  class: SourceReportedFinding
  relation: hasReportedFinding
  parts:
  - physical_page: 7
    text: "As expected in the normal-flame ISS testing, the flame size increases with\
      \ reactant flow rate \nand decreases with ambient oxygen concentration.  Very\
      \ small flames have low radiative loss and \nasymptotically approach steady-state\
      \ behavior, where one flame lasted over 14 minutes until it \nwas terminated\
      \ due to operational constraints.  In contrast, large flames increase in size\
      \ over time \nuntil the flame extinguishes because of radiative heat loss. \
      \ Before extinction, these flames \nexperience an unstable oscillatory mode,\
      \ in which they partially quench and reform.  The \noscillations grow in magnitude\
      \ until the flame fully extinguishes."
  context_statement: acme-flame-design-method
- id: acme-sflame-method
  source_id: ntrs-20220005205
  investigations:
  - psi-23
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  parts:
  - physical_page: 7
    text: "The spherical flames \nwere ignited and allowed to transition naturally\
      \ toward extinction, where a specific objective is to \nidentify the extinction\
      \ limits for both radiative and convective extinction (i.e., at high and low\
      \ \nsystem Damköhler numbers, respectively).  Tests were conducted with either\
      \ nitrogen or helium \nas the diluent in both the fuel and chamber atmosphere.\
      \  The fuel gases included hydrogen, \nmethane, hydrogen/methane mixtures, and\
      \ ethylene where an example hydrogen flame can be seen \nin Fig. 4c."
- id: acme-sflame-finding
  source_id: ntrs-20220005205
  investigations:
  - psi-23
  class: SourceReportedFinding
  relation: hasReportedFinding
  parts:
  - physical_page: 8
    text: "Both radiative and kinetic (i.e., convective) extinction of the spherical\
      \ flames appear to have \nbeen observed.  Radiative extinction seems to occur\
      \ at high flow rates and kinetic extinction at \nlow flow rates.  The latter\
      \ may seem counterintuitive but at low flow rates the flames are close to \n\
      the burner where the velocities are highest.  With helium, rather than nitrogen,\
      \ dilution of both the \nfuel and oxygen, the extinction limits are shifted\
      \ and kinetic extinction is generally difficult to \ndiscern."
  context_statement: acme-sflame-method
- id: acme-cfig-method
  source_id: ntrs-20220005205
  investigations:
  - psi-159
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  parts:
  - physical_page: 8
    text: "Tests were carried out with normal- \nand inverse-flame tests of ethane,\
      \ propane, and n-butane."
- id: acme-cfig-finding
  source_id: ntrs-20220005205
  investigations:
  - psi-159
  class: SourceReportedFinding
  relation: hasReportedFinding
  parts:
  - physical_page: 8
    text: "Cool flames were discovered in normal-flame CFI-G testing with n-butane\
      \ as can be seen in \nFig. 5 which features a sequence of images from an intensified\
      \ camera filtered for formaldehyde \nemissions.  As expected, the cool flames\
      \ are significantly smaller than the corresponding hot \nflames."
  context_statement: acme-cfig-method
- id: spice-slice-shared-hardware
  source_id: ntrs-20140009169
  investigations:
  - psi-107
  - psi-106
  class: Apparatus
  relation: usesApparatus
  parts:
  - physical_page: 3
    text: "The SPICE and SLICE experiments were both conducted in the Microgravity\
      \ Science Glovebox \n(MSG) using common hardware which has since been used for\
      \ the Burning and Suppression of \nSolids (BASS) experiment.  The manually-operated\
      \ hardware, e.g., where the ISS crew \ncontrolled the flow with a potentiometer,\
      \ was based on the preceding ELF experiment and was \ndesigned for exploratory\
      \ studies.  The flame instrumentation was limited to a high-resolution \ndigital\
      \ still camera, an analog video camera, and a thermopile radiometer with a manually-\n\
      adjustable gain.  In addition to the radiometer output, the fuel flow, the coflow\
      \ fan voltage, a \ncoflow reference velocity, and a time stamp were both displayed\
      \ and recorded through a video \noverlay."
  also_classes:
  - DocumentaryMethod
  additional_relations:
  - hasDocumentedMethod
  identity_scope: source-reported common hardware configuration; no serial physical-device
    identity reconciliation
