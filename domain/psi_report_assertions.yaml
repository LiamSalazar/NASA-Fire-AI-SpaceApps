- id: flex-report-archival-scope
  source_id: ntrs-20150023456
  investigations:
  - psi-69
  class: DocumentaryMethod
  relation: hasDocumentedMethod
  title: Reported archival scope
  identity_scope: Configuration and reporting scope of this NASA report; no individual-run
    or serial-device identity inferred
  parts:
  - physical_page: 8
    text: "The purpose of this report is to detail and permanently \narchive the results\
      \ of a subset of the FLEX experiments, namely \nthose occurring between March\
      \ 2009 and the end of December \n2011. It is not intended to interpret the data\
      \ from those experi-\nments or to draw any scientific conclusions; that will\
      \ occur \nthrough future NASA reports and peer-reviewed journal articles \n\
      that reference this report."
- id: flex-hibms-description
  source_id: ntrs-20150023456
  investigations:
  - psi-69
  class: Instrument
  relation: usesInstrument
  title: High-Bit-Depth Multispectral imaging package
  identity_scope: Configuration and reporting scope of this NASA report; no individual-run
    or serial-device identity inferred
  parts:
  - physical_page: 10
    text: "The image system for the \nbacklit view was the High-Bit-Depth Multispectral\
      \ (HiBMs) \nimaging package. The HiBMs package had a telemetric imag-\ning optical\
      \ system and a high-resolution 12-bit output digital \ncamera."
  - physical_page: 10
    text: "Almost all of the tests reported herein1 used the full 1024 by \n1024 array\
      \ with a fixed field of view (FOV) of approximately \n30 mm on a side. The images\
      \ used the full 12-bit output and a \nframing rate of approximately 30 frames\
      \ per second (fps). The \nHiBMs package, when used in conjunction with the illumi-\n\
      nation package, can measure the droplet size as a function of \ntime and the\
      \ soot volume fraction for soot-producing flames \n(i.e., heptane for the tests\
      \ described in this report)."
  also_classes:
  - DocumentaryMethod
  additional_relations:
  - hasDocumentedMethod
- id: flex-lluv-description
  source_id: ntrs-20150023456
  investigations:
  - psi-69
  class: Instrument
  relation: usesInstrument
  title: LLUV hydroxyl chemiluminescence imaging package
  identity_scope: Configuration and reporting scope of this NASA report; no individual-run
    or serial-device identity inferred
  parts:
  - physical_page: 10
    text: "The CIR also provided a LLUV package to image the \nchemiluminescence from\
      \ hydroxyl (OH•) emissions from the"
  - physical_page: 10
    text: "burning droplet. The LLUV package was a 1024 by 1024 \nmonochrome frame-transfer\
      \ charged-coupled device (CCD) \narray with 12-bit digital imaging capability.\
      \ The CCD array was \ndirectly coupled to an 18-mm Gen II–UV microchannel plate\
      \ \nintensifier to provide maximum response at short wavelengths. \nThe intensifier\
      \ included intensifier and gating control that \nallowed varied exposure times\
      \ depending on the expected \nbrightness of the flames. The LLUV also had a\
      \ spectral notch \nfilter integrated to image the chemiluminescence at 310 nm\
      \ (the \nfilter had a 10-nm full width at half maximum (FWHM) \nbandwidth).\
      \ Ground control of the LLUV enabled pretest setting \nof the gain, pixel binning,\
      \ and gate to optimally image the flames \nsurrounding the droplets. All of\
      \ the tests reported herein used the \n2 by 2 binned (512 by 512) array with\
      \ a fixed FOV of approxi-\nmately 50 mm on a side. The framing rate for the\
      \ majority of the \ntests was 30 fps, with a smaller number at 15 fps as an\
      \ attempt to \nimprove flame contrast for very dim flames. The intensifier gain\
      \ \ndid vary somewhat over the tests in this report."
  also_classes:
  - DocumentaryMethod
  additional_relations:
  - hasDocumentedMethod
- id: flex-color-camera-description
  source_id: ntrs-20150023456
  investigations:
  - psi-69
  class: Instrument
  relation: usesInstrument
  title: MDCA color camera
  identity_scope: Configuration and reporting scope of this NASA report; no individual-run
    or serial-device identity inferred
  parts:
  - physical_page: 10
    text: "The MDCA provided two diagnostics: a color camera and \nradiometers. The\
      \ color camera provided a visual overview of \nthe FLEX experiments. This camera\
      \ view was augmented with \nillumination from a white-light-emitting diode (LED)\
      \ located \non the MDCA inside the CIR chamber. This camera had a zoom \nlens\
      \ that provided a closeup view of the needles and droplet \nduring droplet formation.\
      \ The white LED was turned on at this \ntime to allow the operator to see the\
      \ droplet formation process. \nImmediately prior to droplet deployment and ignition,\
      \ the \ncamera zoomed out and the white LED turned off to provide an \noverview\
      \ of the combustion process. The FOV of this camera \nwas approximately 110\
      \ by 90 mm. This view, which provided \nflame size, shape, and color information,\
      \ was downlinked to the \nground during nominal test point operations."
  also_classes:
  - DocumentaryMethod
  additional_relations:
  - hasDocumentedMethod
- id: flex-radiometers-description
  source_id: ntrs-20150023456
  investigations:
  - psi-69
  class: Instrument
  relation: usesInstrument
  title: MDCA broadband and filtered radiometers
  identity_scope: Configuration and reporting scope of this NASA report; no individual-run
    or serial-device identity inferred
  parts:
  - physical_page: 10
    text: "The MDCA provided two radiometers: a broadband radiom-\neter to detect\
      \ the total radiative output of the flame and a \nradiometer with a filter to\
      \ examine the emission from the water \nvapor. For the tests reported herein,\
      \ these radiometers were not \nsensitive enough to provide reliable quantitative\
      \ information \nabout flame radiometric output, so the data are not reported.\
      \ A \nreplacement radiometer package will be available for future \nFLEX tests."
  also_classes:
  - DocumentaryMethod
  additional_relations:
  - hasDocumentedMethod
